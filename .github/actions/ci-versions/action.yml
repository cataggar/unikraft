name: 'ci-versions'
description: 'Export tool versions shared across CI workflows.'

runs:
  using: composite
  steps:
    - name: "Export versions"
      shell: bash
      run: |
        set -eu
        {
          echo 'CLANG_VERSION=21.1.8'
          echo 'COMPILER_RT_SRC_SHA256=dd54ae21aee1780fac59445b51ebff601ad016b31ac3a7de3b21126fd3ccb229'
          echo 'CODECHECKER_VERSION=6.27.3'
          echo 'ZIG_VERSION=0.16.0'
        } >> "$GITHUB_ENV"
