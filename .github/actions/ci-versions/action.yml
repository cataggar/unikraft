name: 'ci-versions'
description: 'Export tool versions shared across CI workflows.'

runs:
  using: composite
  steps:
    - name: "Export versions"
      shell: bash
      run: |
        set -eu
        {
          echo 'CLANG_VERSION=21'
          echo 'CODECHECKER_VERSION=6.27.3'
          echo 'ZIG_VERSION=0.16.0'
          echo 'ZIG_X86_64_LINUX_SHA256=70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00'
        } >> "$GITHUB_ENV"
