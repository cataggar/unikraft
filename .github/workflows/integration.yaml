          gcc g++ gcc-ar gcc-nm \
          aarch64-linux-gnu-gcc aarch64-linux-gnu-g++ \
          aarch64-linux-gnu-ld aarch64-linux-gnu-ar \
          aarch64-linux-gnu-nm aarch64-linux-gnu-objcopy \
          aarch64-linux-gnu-objdump aarch64-linux-gnu-readelf \
          aarch64-linux-gnu-strip; do
          if command -v "${command}" >/dev/null 2>&1; then
            echo "Unexpected GNU tool on PATH: ${command}" >&2
            exit 1
          fi
        done

    - name: Install Zig with ghr
      uses: cataggar/ghr/actions/install@114926d37d3825e63bede2ccc7ce56b67eda7495 # v0.8.0
      env:
        GH_TOKEN: ${{ github.token }}
      with:
        ghr-version: v0.8.0
        tools: |
