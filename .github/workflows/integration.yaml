          "-Dapp=${GITHUB_WORKSPACE}/_helloworld"
          "-Doutput=${build}"
          "-Dconfig=${config}"
          "-Dcompiler=zig cc -target aarch64-freestanding-none"
          "-Dcompiler-targeted=true"
          "-Dhost-cc=zig cc"
          "-Dhost-cxx=zig c++"
          # Kconfig's kernel-style list sentinel is intentionally null-derived.
          "-Dhost-cflags=-fno-sanitize=null"
          "-Dmake-arg=AR=zig ar"
          "-Dmake-arg=NM=llvm-nm"
          "-Dmake-arg=OBJCOPY=llvm-objcopy"
