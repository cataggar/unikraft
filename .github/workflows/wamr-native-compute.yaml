name: wamr-native-compute

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [zig16, fleet/wamr-native-156, fleet/wamr-realtime-clock]

# No dispatch, protected environment, cloud credentials, OIDC, or write token.
# This additive context does not replace any existing required Hyper-V gate.
permissions:
  contents: read

jobs:
  wamr-native-compute:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      inner-zip-sha256: ${{ steps.public_binding.outputs.inner_zip_sha256 }}
      inner-zip-bytes: ${{ steps.public_binding.outputs.inner_zip_bytes }}
      container-digest: ${{ steps.public_binding.outputs.container_digest }}
      artifact-id: ${{ steps.public_binding.outputs.artifact_id }}
      artifact-url: ${{ steps.public_binding.outputs.artifact_url }}
      run-id: ${{ steps.public_binding.outputs.run_id }}
      run-attempt: ${{ steps.public_binding.outputs.run_attempt }}
      source-sha: ${{ steps.public_binding.outputs.source_sha }}
      source-tree: ${{ steps.public_binding.outputs.source_tree }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: cataggar/wamr
          ref: a53205d77be3b880eb8f8b96679512ba58e2331a
          path: .d/wamr-source
          persist-credentials: false

      - name: Check the supported x86 runner and existing build prerequisites
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          test -c /dev/kvm
          sudo install -d -o root -g root -m 755 /d
          sudo install -d -o "$(id -u)" -g "$(id -g)" -m 700 /d/wamr-ci
          export PATH="/usr/bin:/bin:${PATH}"
          if ! (
            for name in bash make bison yacc flex lex m4 python3 getfacl; do
              test -x "/usr/bin/${name}" || exit 1
            done
            test -r /usr/share/OVMF/OVMF_CODE_4M.fd
            test -r /usr/share/OVMF/OVMF_VARS_4M.fd
          ); then
            sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources \
              -o Dir::Etc::sourceparts=- update -qq
            sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources \
              -o Dir::Etc::sourceparts=- install -y --no-install-recommends \
              make bison flex m4 python3 acl ovmf
          fi
          mkdir -p .d

      - name: Exercise the production source-custody limits explicitly
        timeout-minutes: 15
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 support/build/wamr-native-ci/tests/source_custody_production_limits.py

      - name: Set up the existing verified native downloader
        uses: cataggar/ghr/actions/setup@114926d37d3825e63bede2ccc7ce56b67eda7495
        with:
          ghr-version: v0.8.0
          cache: 'false'

      - name: Acquire the existing pinned VPC-capable native QEMU runtime
        run: |
          bash .github/scripts/hyperv-native-qemu-acquire.sh /d/wamr-ci/wamr-native-runtime

      - name: Reuse authenticated private Bison data for the native Make contract
        run: |
          export PATH="/usr/bin:/bin:${PATH}"
          bash .github/scripts/hyperv-native-bison-acquire.sh /d/wamr-ci/wamr-native-runtime

      - name: Install the existing pinned Zig compiler
        uses: cataggar/ghr/actions/install@114926d37d3825e63bede2ccc7ce56b67eda7495
        with:
          ghr-version: v0.8.0
          tools: cataggar/zig@v0.16.0 RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U

      - name: Exercise native controller, custody limits, and package-boot fixtures in an isolated x86 worktree
        timeout-minutes: 15
        run: |
          set -euo pipefail
          source_root="${RUNNER_TEMP}/wamr-controller-fixtures"
          test ! -e "${source_root}"
          git worktree add --detach "${source_root}" HEAD
          cleanup() { git worktree remove --force -- "${source_root}"; }
          trap cleanup EXIT
          mkdir -m 0700 -- "${RUNNER_TEMP}/wamr-controller-fixture-cache"
          mkdir -m 0700 -- "${RUNNER_TEMP}/wamr-controller-pipeline-root"
          if ! ZIG_LOCAL_CACHE_DIR="${RUNNER_TEMP}/wamr-controller-fixture-cache" \
            zig build --build-file "${source_root}/support/build/wamr-native-ci/build.zig" \
            -Doptimize=ReleaseSafe -j2 test-controller; then
            if ZIG_LOCAL_CACHE_DIR="${RUNNER_TEMP}/wamr-controller-fixture-cache" \
              zig build --build-file "${source_root}/support/build/wamr-native-ci/build.zig" \
              -Doptimize=ReleaseSafe -j1 test-controller-direct; then
              echo "Direct controller diagnostic passed after the gate failed" >&2
            else
              echo "Direct controller diagnostic also failed" >&2
            fi
            exit 1
          fi
          ZIG_LOCAL_CACHE_DIR="${RUNNER_TEMP}/wamr-controller-fixture-cache" \
            zig build --build-file "${source_root}/support/build/wamr-native-ci/build.zig" \
            -Doptimize=ReleaseSafe -Dtest-root="${RUNNER_TEMP}/wamr-controller-pipeline-root" \
            -j2 test-pipeline
          (
            cd "${source_root}"
            PYTHONDONTWRITEBYTECODE=1 \
              PYTHONPATH="${source_root}/support/build/wamr-native-ci/tests:${source_root}/support/build/wamr-native-ci" \
              python3 -B -m unittest -q test_differential_parity.DeterministicContracts
          )
          controller_root=/d/wamr-ci/wamr-differential-controller
          test ! -e "${controller_root}"
          mkdir -m 0700 -- "${controller_root}"
          ZIG_LOCAL_CACHE_DIR="${RUNNER_TEMP}/wamr-controller-fixture-cache" \
            zig build --build-file "${source_root}/support/build/wamr-native-ci/build.zig" \
              -Dtarget=x86_64-linux-gnu -Dcpu=x86_64_v2 -Doptimize=ReleaseSafe \
              -Dcontroller-runtime="${controller_root}" -j2 install-controller
          test -x "${controller_root}/controller/bin/uk-wamr-native-ci"

      - name: Record the runner CPU and portable executable target
        run: |
          set -euo pipefail
          model="$(sed -n 's/^model name[[:space:]]*:[[:space:]]*//p' /proc/cpuinfo \
            | head -n 1)"
          probe="${RUNNER_TEMP}/native-cpu-probe.zig"
          printf '%s\n' \
            'const std = @import("std");' \
            'const builtin = @import("builtin");' \
            'pub fn main() void {' \
            '    std.debug.print("{s}\n", .{builtin.cpu.model.name});' \
            '}' > "${probe}"
          zig_cpu="$(zig run "${probe}" 2>&1 | grep -oE '^[a-z0-9_]+$' | tail -n 1)"
          rm -f "${probe}"
          if [[ ! "${zig_cpu}" =~ ^[a-z0-9_]{2,32}$ ]]; then
            echo "Could not resolve the Zig native CPU" >&2
            exit 1
          fi
          echo "Runner CPU model: ${model:-unknown}"
          echo "Zig native CPU: ${zig_cpu}"
          python3 -B - <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path("support/build/wamr-native-ci/run.py").resolve()
          spec = importlib.util.spec_from_file_location("wamr_native_ci", path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          print("Recorded supervisor/validator target:",
                " ".join(module.RECORDED_EXECUTABLE_TARGET))
          PY

      - name: Acquire the existing native LLVM distribution
        uses: cataggar/ghr/actions/download@114926d37d3825e63bede2ccc7ce56b67eda7495
        with:
          ghr-version: v0.8.0
          tools: cataggar/llvm-project/llvm-tools-22.1.8-x86_64-linux.tar.xz@llvm-zig-22.1.8
          dest: /d/wamr-ci/wamr-native-runtime/llvm
          extract: 'true'
          strip-components: '1'
          cache: 'false'

      - name: Establish the exact QEMU dynamic runtime before custody
        run: |
          bash .github/scripts/hyperv-native-libfdt-prepare.sh /d/wamr-ci/wamr-native-runtime

      - name: Build the tiny AOT image with the installed native producer and safety graph
        timeout-minutes: 45
        run: |
          set -euo pipefail
          umask 077
          root=/d/wamr-ci/wamr-native-runtime
          zig_source="$(dirname "$(readlink -f "$(command -v zig)")")"
          zig_dir=/d/wamr-ci/wamr-native-tools/zig-0.16.0
          test ! -e "${zig_dir}"
          mkdir -p -m 700 "${zig_dir}"
          cp -a -- "${zig_source}/." "${zig_dir}/"
          chmod -R u=rwX,go= "${zig_dir}"
          mkdir -m 700 "${root}/firmware"
          cp --no-preserve=mode,ownership \
            "$(readlink -f /usr/share/OVMF/OVMF_CODE_4M.fd)" "${root}/firmware/code.fd"
          cp --no-preserve=mode,ownership \
            "$(readlink -f /usr/share/OVMF/OVMF_VARS_4M.fd)" "${root}/firmware/vars.fd"
          for name in llvm-readelf llvm-strip; do
            alias="${root}/llvm/bin/${name}"
            target="$(readlink -f "${alias}")"
            test -f "${target}"
            temporary="${alias}.materialized"
            test ! -e "${temporary}"
            cp --no-preserve=mode,ownership -- "${target}" "${temporary}"
            chmod 500 "${temporary}"
            rm -- "${alias}"
            mv -- "${temporary}" "${alias}"
          done
          export PATH="${zig_dir}:${root}/llvm/bin:/usr/bin:/bin:${PATH}"
          echo "${zig_dir}" >> "${GITHUB_PATH}"
          echo "${root}/llvm/bin" >> "${GITHUB_PATH}"
          python3 support/build/wamr-native-ci/run.py build --runtime "${root}" \
            --wamr-source "${GITHUB_WORKSPACE}/.d/wamr-source"

      - name: Run six Python boots and paired native success in the managed KVM process
        timeout-minutes: 150
        env:
          QUALIFICATION_REPOSITORY_ID: ${{ github.repository_id }}
          QUALIFICATION_SOURCE_JOB: wamr-native-compute
        run: |
          set -euo pipefail
          root=/d/wamr-ci/wamr-native-runtime
          zig_dir="$(dirname "$(readlink -f "$(command -v zig)")")"
          export PATH="${zig_dir}:${root}/llvm/bin:/usr/bin:/bin:${PATH}"
          bash .github/scripts/hyperv-qemu-candidate-runtime.sh "${root}" compute

      - name: Retain the expressly authorized public-source tiny image bundle
        id: public_bundle
        timeout-minutes: 15
        env:
          GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.private == false && 'public' || 'private' }}
          WAMR_CI_RUNTIME: /d/wamr-ci/wamr-native-runtime
        run: |
          set -euo pipefail
          umask 077
          root=/d/wamr-ci/wamr-native-runtime
          export TMPDIR="${root}/compute/scratch"
          export PYTHONDONTWRITEBYTECODE=1
          zig_dir="$(dirname "$(readlink -f "$(command -v zig)")")"
          export PATH="${zig_dir}:${root}/llvm/bin:/usr/bin:/bin:${PATH}"
          result="$(python3 support/build/wamr-native-ci/handoff.py public-source-bundle)"
          printf '%s\n' "${result}"
          archive_sha256="$(
            printf '%s\n' "${result}" |
              sed -n 's/^Public source archive SHA-256: //p'
          )"
          if [[ ! "${archive_sha256}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Invalid public-source archive digest" >&2
            exit 1
          fi
          source_tree="$(
            printf '%s\n' "${result}" |
              sed -n 's/^Public source tree: //p'
          )"
          if [[ ! "${source_tree}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid public-source tree" >&2
            exit 1
          fi
          staging="${GITHUB_WORKSPACE}/.d/wamr-public-source-bundle/tiny-aot-public-source.zip"
          upload_dir=/d/wamr-public-source-upload
          upload_file="${upload_dir}/tiny-aot-public-source.zip"
          test ! -e "${upload_dir}"
          sudo install -d -o root -g "$(id -g)" -m 0550 "${upload_dir}"
          sudo python3 - "${staging}" "${upload_file}" \
            "${archive_sha256}" "$(id -g)" <<'PY'
          import hashlib
          import os
          import stat
          import sys

          source, destination, expected, group = sys.argv[1:]
          read_flags = os.O_RDONLY
          read_flags |= getattr(os, "O_CLOEXEC", 0)
          read_flags |= getattr(os, "O_NOFOLLOW", 0)
          source_fd = os.open(source, read_flags)
          destination_fd = -1
          try:
              source_info = os.fstat(source_fd)
              if (
                  not stat.S_ISREG(source_info.st_mode)
                  or source_info.st_nlink != 1
                  or not 0 < source_info.st_size <= 512 * 1024 * 1024
              ):
                  raise SystemExit("unsafe verified upload source")
              source_identity = tuple(
                  getattr(source_info, name) for name in (
                      "st_dev", "st_ino", "st_mode", "st_uid", "st_gid",
                      "st_nlink", "st_size", "st_mtime_ns", "st_ctime_ns"))
              write_flags = os.O_WRONLY | os.O_CREAT | os.O_EXCL
              write_flags |= getattr(os, "O_CLOEXEC", 0)
              write_flags |= getattr(os, "O_NOFOLLOW", 0)
              destination_fd = os.open(destination, write_flags, 0o440)
              digest = hashlib.sha256()
              total = 0
              while True:
                  chunk = os.read(source_fd, 65536)
                  if not chunk:
                      break
                  digest.update(chunk)
                  total += len(chunk)
                  offset = 0
                  while offset < len(chunk):
                      written = os.write(destination_fd, chunk[offset:])
                      if written <= 0:
                          raise SystemExit("verified upload copy failed")
                      offset += written
              final_source = os.fstat(source_fd)
              final_identity = tuple(
                  getattr(final_source, name) for name in (
                      "st_dev", "st_ino", "st_mode", "st_uid", "st_gid",
                      "st_nlink", "st_size", "st_mtime_ns", "st_ctime_ns"))
              if (
                  total != source_info.st_size
                  or digest.hexdigest() != expected
                  or final_identity != source_identity
              ):
                  raise SystemExit("verified upload copy changed")
              os.fchown(destination_fd, 0, int(group))
              os.fchmod(destination_fd, 0o440)
              os.fsync(destination_fd)
          finally:
              if destination_fd >= 0:
                  os.close(destination_fd)
              os.close(source_fd)
          PY
          verified="$(
            python3 support/build/wamr-native-ci/handoff.py \
              verify-public-source-bundle \
              --archive "${upload_file}" \
              --expected-source "${GITHUB_SHA}" \
              --expected-tree "${source_tree}" \
              --expected-archive-sha256 "${archive_sha256}" \
              --run-id "${GITHUB_RUN_ID}" \
              --run-attempt "${GITHUB_RUN_ATTEMPT}"
          )"
          test "$(
            printf '%s\n' "${verified}" |
              sed -n 's/^Public source archive SHA-256: //p'
          )" = "${archive_sha256}"
          {
            echo "inner_zip_sha256=${archive_sha256}"
            echo "upload_file=${upload_file}"
            echo "source_tree=${source_tree}"
          } >> "${GITHUB_OUTPUT}"

      - name: Remove only the managed QEMU dynamic runtime
        if: always()
        run: |
          bash .github/scripts/hyperv-native-libfdt-cleanup.sh /d/wamr-ci/wamr-native-runtime

      - name: Publish only the standalone verified public-source image archive
        id: public_upload
        uses: actions/upload-artifact@v4
        with:
          name: wamr-public-source-tiny-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ steps.public_bundle.outputs.upload_file }}
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Reserve the exact-artifact redownload destination
        id: public_redownload
        run: |
          set -euo pipefail
          destination=/d/wamr-ci/wamr-public-source-redownload
          python3 - "${destination}" <<'PY'
          import os
          import stat
          import sys

          destination = sys.argv[1]
          os.mkdir(destination, 0o700)
          info = os.lstat(destination)
          if (
              not stat.S_ISDIR(info.st_mode)
              or info.st_uid != os.getuid()
              or stat.S_IMODE(info.st_mode) != 0o700
          ):
              raise SystemExit("private exact-artifact destination required")
          PY
          echo "destination=${destination}" >> "${GITHUB_OUTPUT}"

      - name: Redownload only the uploaded public-source artifact ID
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.public_upload.outputs.artifact-id }}
          path: ${{ steps.public_redownload.outputs.destination }}
          merge-multiple: true

      - name: Bind and publish the redownloaded inner public-source ZIP
        id: public_binding
        env:
          INNER_ZIP_SHA256: ${{ steps.public_bundle.outputs.inner_zip_sha256 }}
          CONTAINER_DIGEST: ${{ steps.public_upload.outputs.artifact-digest }}
          ARTIFACT_ID: ${{ steps.public_upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.public_upload.outputs.artifact-url }}
          REDOWNLOAD_DIR: ${{ steps.public_redownload.outputs.destination }}
          SOURCE_TREE: ${{ steps.public_bundle.outputs.source_tree }}
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          archive="${REDOWNLOAD_DIR}/tiny-aot-public-source.zip"
          python3 - "${REDOWNLOAD_DIR}" <<'PY'
          import os
          from pathlib import Path
          import stat
          import sys

          root = Path(sys.argv[1])
          flags = os.O_RDONLY | os.O_DIRECTORY
          flags |= getattr(os, "O_CLOEXEC", 0)
          flags |= getattr(os, "O_NOFOLLOW", 0)
          handle = os.open(root, flags)
          try:
              with os.scandir(handle) as entries:
                  found = []
                  for entry in entries:
                      if found:
                          raise SystemExit(
                              "unexpected exact-artifact download members")
                      found.append(entry)
              if len(found) != 1 or found[0].name != "tiny-aot-public-source.zip":
                  raise SystemExit("unexpected exact-artifact download members")
              info = os.stat(
                  found[0].name, dir_fd=handle, follow_symlinks=False)
              if not stat.S_ISREG(info.st_mode) or info.st_nlink != 1:
                  raise SystemExit("downloaded inner ZIP is not one regular file")
          finally:
              os.close(handle)
          PY
          verified="$(
            python3 support/build/wamr-native-ci/handoff.py \
              verify-public-source-bundle \
              --archive "${archive}" \
              --expected-source "${GITHUB_SHA}" \
              --expected-tree "${SOURCE_TREE}" \
              --expected-archive-sha256 "${INNER_ZIP_SHA256}" \
              --run-id "${GITHUB_RUN_ID}" \
              --run-attempt "${GITHUB_RUN_ATTEMPT}"
          )"
          downloaded_sha256="$(
            printf '%s\n' "${verified}" |
              sed -n 's/^Public source archive SHA-256: //p'
          )"
          test "${downloaded_sha256}" = "${INNER_ZIP_SHA256}"
          inner_zip_bytes="$(stat -c '%s' -- "${archive}")"
          [[ "${inner_zip_bytes}" =~ ^[1-9][0-9]*$ ]]
          test "${inner_zip_bytes}" -le $((512 * 1024 * 1024))
          [[ "${ARTIFACT_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${CONTAINER_DIGEST}" =~ ^[0-9a-f]{64}$ ]]
          test -n "${ARTIFACT_URL}"
          root=/d/wamr-ci/wamr-native-runtime
          import_root="${root}/compute/public-source/exact-redownload"
          mkdir -m 700 "${import_root}"
          validator="${root}/compute/public-source/tools/bin/uk-wamr-direct-validate"
          supervisor="${root}/compute/supervisor/bin/wamr-ci-supervisor"
          python3 support/build/wamr-native-ci/handoff.py \
            import-public-source-bundle \
            --archive "${archive}" \
            --output "${import_root}/success" \
            --expected-source "${GITHUB_SHA}" \
            --expected-tree "${SOURCE_TREE}" \
            --expected-archive-sha256 "${INNER_ZIP_SHA256}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --validator "${validator}" \
            --supervisor "${supervisor}" \
            --artifact-id "${ARTIFACT_ID}" \
            --container-digest "${CONTAINER_DIGEST}"
          python3 support/build/wamr-native-ci/handoff.py candidate \
            --bundle "${import_root}/success/bundle.json" \
            --output "${import_root}/candidate-scope.json"
          "${validator}" candidate "${import_root}/candidate-scope.json"
          if WAMR_CI_SUPERVISOR="${supervisor}" \
            python3 support/build/wamr-native-ci/handoff.py \
              import-public-source-bundle \
              --archive "${archive}" \
              --output "${import_root}/ambient-refused" \
              --expected-source "${GITHUB_SHA}" \
              --expected-tree "${SOURCE_TREE}" \
              --expected-archive-sha256 "${INNER_ZIP_SHA256}" \
              --run-id "${GITHUB_RUN_ID}" \
              --run-attempt "${GITHUB_RUN_ATTEMPT}" \
              --validator "${validator}" \
              --artifact-id "${ARTIFACT_ID}" \
              --container-digest "${CONTAINER_DIGEST}" \
              >"${import_root}/ambient.stdout" \
              2>"${import_root}/ambient.stderr"; then
            echo "Ambient supervisor fallback was accepted" >&2
            exit 1
          fi
          cp -- "${supervisor}" "${import_root}/tampered-supervisor"
          python3 - "${import_root}/tampered-supervisor" <<'PY'
          import os
          import sys

          path = sys.argv[1]
          flags = os.O_RDWR | getattr(os, "O_CLOEXEC", 0)
          flags |= getattr(os, "O_NOFOLLOW", 0)
          handle = os.open(path, flags)
          try:
              original = os.pread(handle, 1, 4096)
              if len(original) != 1:
                  raise SystemExit("supervisor tamper fixture unavailable")
              os.pwrite(handle, bytes([original[0] ^ 1]), 4096)
              os.fsync(handle)
          finally:
              os.close(handle)
          PY
          chmod 500 "${import_root}/tampered-supervisor"
          for case in tampered wrong-tool; do
            candidate="${import_root}/tampered-supervisor"
            if [[ "${case}" == wrong-tool ]]; then
              candidate="${validator}"
            fi
            if python3 support/build/wamr-native-ci/handoff.py \
              import-public-source-bundle \
              --archive "${archive}" \
              --output "${import_root}/${case}-refused" \
              --expected-source "${GITHUB_SHA}" \
              --expected-tree "${SOURCE_TREE}" \
              --expected-archive-sha256 "${INNER_ZIP_SHA256}" \
              --run-id "${GITHUB_RUN_ID}" \
              --run-attempt "${GITHUB_RUN_ATTEMPT}" \
              --validator "${validator}" \
              --supervisor "${candidate}" \
              --artifact-id "${ARTIFACT_ID}" \
              --container-digest "${CONTAINER_DIGEST}" \
              >"${import_root}/${case}.stdout" \
              2>"${import_root}/${case}.stderr"; then
              echo "Invalid explicit supervisor was accepted: ${case}" >&2
              exit 1
            fi
          done
          {
            echo "inner_zip_sha256=${INNER_ZIP_SHA256}"
            echo "inner_zip_bytes=${inner_zip_bytes}"
            echo "container_digest=${CONTAINER_DIGEST}"
            echo "artifact_id=${ARTIFACT_ID}"
            echo "artifact_url=${ARTIFACT_URL}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "source_sha=${GITHUB_SHA}"
            echo "source_tree=${SOURCE_TREE}"
          } >> "${GITHUB_OUTPUT}"
          {
            echo '## Exact WAMR public-source image'
            echo
            echo "Inner ZIP SHA-256: \`${INNER_ZIP_SHA256}\`"
            echo "Inner ZIP bytes: \`${inner_zip_bytes}\`"
            echo "Artifact container digest: \`${CONTAINER_DIGEST}\`"
            echo "Artifact ID: \`${ARTIFACT_ID}\`"
            echo "Artifact URL: ${ARTIFACT_URL}"
            echo
            echo "Source: \`${GITHUB_SHA}/${SOURCE_TREE}\`"
            echo "Run: \`${GITHUB_REPOSITORY}/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}:wamr-native-compute\`"
            python3 - "${archive}" <<'PY'
          import json
          import sys
          import zipfile

          with zipfile.ZipFile(sys.argv[1]) as archive:
              bundle = json.loads(archive.read("bundle.json"))
              artifacts = dict(zip(
                  ("efi", "debug_elf", "bootinfo", "raw", "qcow2", "vhd"),
                  bundle["artifacts"][:6],
              ))
              finalization = json.loads(
                  archive.read("evidence/qcow2-finalization.json"))
              derivation = json.loads(
                  archive.read("evidence/fixed-vhd-derivation.json"))
          print()
          print("Artifact bytes:")
          for name in ("efi", "raw", "qcow2", "vhd"):
              print(f"- {name}: file_bytes={artifacts[name]['size']} sha256={artifacts[name]['sha256']}")
          print(
              "- qcow2: "
              f"allocated={finalization['output']['allocated']} "
              f"virtual_bytes={finalization['output']['virtual_bytes']} "
              "cluster_bytes=65536 compression=zstd standalone=true")
          print(
              "- vhd: "
              f"allocated={derivation['output']['allocated']} "
              f"virtual_bytes={derivation['output']['virtual_bytes']} "
              f"footer_sha256={derivation['footer']['sha256']}")
          PY
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Retain redacted diagnostics separately from the public-source image bundle
        if: always()
        run: |
          python3 support/build/wamr-native-ci/run.py diagnostics \
            --runtime /d/wamr-ci/wamr-native-runtime

      - name: Publish bounded local-only records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wamr-native-compute-${{ github.run_id }}-${{ github.run_attempt }}
          path: /d/wamr-ci/wamr-native-runtime/compute/evidence/*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  wamr-differential-parity:
    needs: wamr-native-compute
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        case: [build-start-tamper, missing-build, occupied-boot-slot, prior-build-output]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: cataggar/wamr
          ref: a53205d77be3b880eb8f8b96679512ba58e2331a
          path: .d/wamr-source
          persist-credentials: false

      - name: Check the x86 KVM runner and build prerequisites
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          test -c /dev/kvm
          sudo install -d -o root -g root -m 755 /d
          sudo install -d -o "$(id -u)" -g "$(id -g)" -m 700 /d/wamr-ci
          export PATH="/usr/bin:/bin:${PATH}"
          if ! (
            for name in bash make bison yacc flex lex m4 python3 getfacl; do
              test -x "/usr/bin/${name}" || exit 1
            done
            test -r /usr/share/OVMF/OVMF_CODE_4M.fd
            test -r /usr/share/OVMF/OVMF_VARS_4M.fd
          ); then
            sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources \
              -o Dir::Etc::sourceparts=- update -qq
            sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources \
              -o Dir::Etc::sourceparts=- install -y --no-install-recommends \
              make bison flex m4 python3 acl ovmf
          fi
          mkdir -p .d

      - name: Set up the pinned native downloader
        uses: cataggar/ghr/actions/setup@114926d37d3825e63bede2ccc7ce56b67eda7495
        with:
          ghr-version: v0.8.0
          cache: 'false'

      - name: Acquire the pinned QEMU runtime and private Bison data
        run: |
          set -euo pipefail
          bash .github/scripts/hyperv-native-qemu-acquire.sh /d/wamr-ci/wamr-native-runtime
          export PATH="/usr/bin:/bin:${PATH}"
          bash .github/scripts/hyperv-native-bison-acquire.sh /d/wamr-ci/wamr-native-runtime

      - name: Install the pinned Zig compiler
        uses: cataggar/ghr/actions/install@114926d37d3825e63bede2ccc7ce56b67eda7495
        with:
          ghr-version: v0.8.0
          tools: cataggar/zig@v0.16.0 RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U

      - name: Acquire the pinned LLVM distribution
        uses: cataggar/ghr/actions/download@114926d37d3825e63bede2ccc7ce56b67eda7495
        with:
          ghr-version: v0.8.0
          tools: cataggar/llvm-project/llvm-tools-22.1.8-x86_64-linux.tar.xz@llvm-zig-22.1.8
          dest: /d/wamr-ci/wamr-native-runtime/llvm
          extract: 'true'
          strip-components: '1'
          cache: 'false'

      - name: Install the portable controller and complete private runtime inputs
        timeout-minutes: 15
        run: |
          set -euo pipefail
          umask 077
          root=/d/wamr-ci/wamr-native-runtime
          zig_source="$(dirname "$(readlink -f "$(command -v zig)")")"
          zig_dir=/d/wamr-ci/wamr-native-tools/zig-0.16.0
          test ! -e "${zig_dir}"
          mkdir -p -m 700 "${zig_dir}"
          cp -a -- "${zig_source}/." "${zig_dir}/"
          chmod -R u=rwX,go= "${zig_dir}"
          mkdir -m 700 "${root}/firmware"
          cp --no-preserve=mode,ownership \
            "$(readlink -f /usr/share/OVMF/OVMF_CODE_4M.fd)" "${root}/firmware/code.fd"
          cp --no-preserve=mode,ownership \
            "$(readlink -f /usr/share/OVMF/OVMF_VARS_4M.fd)" "${root}/firmware/vars.fd"
          for name in llvm-readelf llvm-strip; do
            alias="${root}/llvm/bin/${name}"
            target="$(readlink -f "${alias}")"
            test -f "${target}"
            temporary="${alias}.materialized"
            test ! -e "${temporary}"
            cp --no-preserve=mode,ownership -- "${target}" "${temporary}"
            chmod 500 "${temporary}"
            rm -- "${alias}"
            mv -- "${temporary}" "${alias}"
          done
          export PATH="${zig_dir}:${root}/llvm/bin:/usr/bin:/bin:${PATH}"
          controller_root=/d/wamr-ci/wamr-differential-controller
          test ! -e "${controller_root}"
          mkdir -m 0700 -- "${controller_root}"
          mkdir -m 0700 -- "${RUNNER_TEMP}/wamr-differential-controller-cache"
          ZIG_LOCAL_CACHE_DIR="${RUNNER_TEMP}/wamr-differential-controller-cache" \
            zig build --build-file support/build/wamr-native-ci/build.zig \
              -Dtarget=x86_64-linux-gnu -Dcpu=x86_64_v2 -Doptimize=ReleaseSafe \
              -Dcontroller-runtime="${controller_root}" -j2 install-controller
          test -x "${controller_root}/controller/bin/uk-wamr-native-ci"

      - name: Compare paired real fault outcomes with managed KVM
        timeout-minutes: 150
        env:
          QUALIFICATION_REPOSITORY_ID: ${{ github.repository_id }}
          QUALIFICATION_SOURCE_JOB: wamr-differential-parity
          DIFFERENTIAL_CASE: ${{ matrix.case }}
        run: |
          set -euo pipefail
          root=/d/wamr-ci/wamr-native-runtime
          zig_dir="$(dirname "$(readlink -f "$(command -v zig)")")"
          export PATH="${zig_dir}:${root}/llvm/bin:/usr/bin:/bin:${PATH}"
          bash .github/scripts/hyperv-qemu-candidate-runtime.sh \
            "${root}" differential "${DIFFERENTIAL_CASE}"

      - name: Remove only the managed QEMU dynamic runtime
        if: always()
        run: |
          bash .github/scripts/hyperv-native-libfdt-cleanup.sh /d/wamr-ci/wamr-native-runtime
