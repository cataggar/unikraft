name: hyperv-qemu-candidate

on:
  push:
    branches: [fleet/zig-hyperv-qemu-qualification]
    paths:
      - .github/workflows/hyperv-qemu-candidate.yaml
      - .github/scripts/hyperv-qemu-candidate.sh
      - .github/scripts/hyperv-qemu-candidate-runtime.sh
      - .github/scripts/hyperv-qemu-candidate-guest.sh
      - .github/scripts/hyperv-native-qemu-acquire.sh
  workflow_dispatch:

permissions:
  contents: read
  attestations: read

jobs:
  zig-hyperv:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up verified native downloader
        uses: cataggar/ghr/actions/setup@114926d37d3825e63bede2ccc7ce56b67eda7495
        with:
          ghr-version: v0.8.0
          cache: 'false'

      - name: Acquire the pinned native QEMU runtime without installation hooks
        run: |
          bash .github/scripts/hyperv-native-qemu-acquire.sh "${RUNNER_TEMP}/qemu-vpc-candidate"

      - name: Install the existing pinned native compiler
        uses: cataggar/ghr/actions/install@114926d37d3825e63bede2ccc7ce56b67eda7495
        with:
          ghr-version: v0.8.0
          tools: cataggar/zig@v0.16.0 RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U

      - name: Acquire the existing native LLVM tool distribution
        uses: cataggar/ghr/actions/download@114926d37d3825e63bede2ccc7ce56b67eda7495
        with:
          ghr-version: v0.8.0
          tools: cataggar/llvm-project/llvm-tools-22.1.8-x86_64-linux.tar.xz@llvm-zig-22.1.8
          dest: ${{ runner.temp }}/qemu-vpc-candidate/llvm
          extract: 'true'
          strip-components: '1'
          cache: 'false'

      - name: Acquire firmware data without installation hooks
        run: |
          set -euo pipefail
          set -C
          umask 077
          root="${RUNNER_TEMP}/qemu-vpc-candidate"
          export APT_CONFIG="${root}/evidence/apt.conf"
          mkdir -m 700 "${root}/firmware"
          apt-cache policy ovmf > "${root}/evidence/ovmf-policy.txt"
          version="$(awk '$1 == "Candidate:" { print $2 }' "${root}/evidence/ovmf-policy.txt")"
          test -n "${version}"
          test "${version}" != "(none)"
          apt-cache show "ovmf=${version}" > "${root}/evidence/ovmf-package.txt"
          (
            cd "${root}/downloads"
            apt-get download "ovmf=${version}" > "${root}/evidence/ovmf-download.txt" 2>&1
          )
          packages=("${root}"/downloads/ovmf_*.deb)
          test "${#packages[@]}" -eq 1
          expected="$(awk '$1 == "SHA256:" { print $2 }' "${root}/evidence/ovmf-package.txt" | sort -u)"
          [[ "${expected}" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "${expected}" "${packages[0]}" | sha256sum -c - \
            > "${root}/evidence/ovmf-package-valid.txt"
          dpkg-deb --fsys-tarfile "${packages[0]}" > "${root}/downloads/ovmf.tar"
          tar --list --verbose --file "${root}/downloads/ovmf.tar" \
            > "${root}/evidence/ovmf-members.txt"
          for kind in CODE VARS; do
            member="./usr/share/OVMF/OVMF_${kind}_4M.fd"
            awk -v member="${member}" '
              $NF == member { count++; if (substr($1, 1, 1) != "-") exit 1 }
              END { if (count != 1) exit 1 }
            ' "${root}/evidence/ovmf-members.txt"
            name="$(printf '%s' "${kind}" | tr 'A-Z' 'a-z')"
            tar --extract --to-stdout --no-wildcards --file "${root}/downloads/ovmf.tar" \
              -- "${member}" > "${root}/firmware/${name}.fd"
            chmod 600 "${root}/firmware/${name}.fd"
          done
          sha256sum "${root}/firmware/code.fd" "${root}/firmware/vars.fd" \
            > "${root}/evidence/firmware.sha256"
          echo "${root}/llvm/bin" >> "${GITHUB_PATH}"

      - name: Materialize authenticated Bison data outside writable runner directories
        run: |
          set -euo pipefail
          set -C
          umask 077
          export LC_ALL=C
          root="${RUNNER_TEMP}/qemu-vpc-candidate"
          export APT_CONFIG="${root}/evidence/apt.conf"
          mkdir -m 700 "${root}/bison"
          version="$(dpkg-query --show --showformat='${Version}' bison)"
          test -n "${version}"
          apt-cache show "bison=${version}" > "${root}/evidence/bison-package.txt"
          (
            cd "${root}/downloads"
            apt-get download "bison=${version}" > "${root}/evidence/bison-download.txt" 2>&1
          )
          packages=("${root}"/downloads/bison_*.deb)
          test "${#packages[@]}" -eq 1
          expected="$(awk '$1 == "SHA256:" { print $2 }' "${root}/evidence/bison-package.txt" | sort -u)"
          [[ "${expected}" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "${expected}" "${packages[0]}" | sha256sum -c - \
            > "${root}/evidence/bison-package-valid.txt"
          dpkg-deb --fsys-tarfile "${packages[0]}" > "${root}/downloads/bison.tar"
          tar --list --verbose --ignore-zeros --quoting-style=escape \
            --file "${root}/downloads/bison.tar" > "${root}/evidence/bison-members.txt"
          awk '
            $NF == "./usr/bin/bison" {
              count++
              if (NF != 6 || substr($1, 1, 1) != "-") exit 1
            }
            END { if (count != 1) exit 1 }
          ' "${root}/evidence/bison-members.txt"
          tar --extract --to-stdout --no-wildcards --file "${root}/downloads/bison.tar" \
            -- ./usr/bin/bison > "${root}/downloads/bison-member.elf"
          executable="$(readlink -f "$(type -P bison)")"
          cmp "${root}/downloads/bison-member.elf" "${executable}"
          sha256sum "${root}/downloads/bison-member.elf" "${executable}" \
            > "${root}/evidence/bison-executable-match.sha256"
          awk '
            $0 ~ / \.\/usr\/share\/bison\// {
              if (NF != 6 || $1 !~ /^[-d]/ ||
                  $NF !~ /^\.\/usr\/share\/bison\/[A-Za-z0-9_.+/-]*$/) exit 1
              name = $NF
              sub(/^\.\/usr\/share\/bison\//, "", name)
              sub(/\/$/, "", name)
              if (name ~ /(^|\/)\.\.?($|\/)/ || name ~ /\/\// || seen[name]++) exit 1
              if (substr($1, 1, 1) == "-") print $NF
            }
          ' "${root}/evidence/bison-members.txt" > "${root}/evidence/bison-data-members.txt"
          test -s "${root}/evidence/bison-data-members.txt"
          : > "${root}/evidence/bison-data.sha256"
          while IFS= read -r member; do
            relative="${member#./usr/share/bison/}"
            output="${root}/bison/${relative}"
            mkdir -p "$(dirname "${output}")"
            tar --extract --to-stdout --no-wildcards --file "${root}/downloads/bison.tar" \
              -- "${member}" > "${output}"
            chmod 400 "${output}"
            sha256sum "${output}" >> "${root}/evidence/bison-data.sha256"
          done < "${root}/evidence/bison-data-members.txt"
          echo "BISON_PKGDATADIR=${root}/bison" >> "${GITHUB_ENV}"

      - name: Build a fresh public EFI and the native controller
        run: |
          set -euo pipefail
          bash .github/scripts/hyperv-qemu-candidate-guest.sh build "${RUNNER_TEMP}/qemu-vpc-candidate"
          sha256sum -c "${RUNNER_TEMP}/qemu-vpc-candidate/evidence/bison-data.sha256" \
            > "${RUNNER_TEMP}/qemu-vpc-candidate/evidence/bison-data-after-build.txt"

      - name: Exercise the managed native runtime and real four-boot matrix
        env:
          QUALIFICATION_REPOSITORY_ID: ${{ github.repository_id }}
          QUALIFICATION_SOURCE_JOB: zig-hyperv
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/qemu-vpc-candidate"
          bash .github/scripts/hyperv-qemu-candidate-runtime.sh "${root}"

      - name: Retain bounded candidate evidence, not images or executable archives
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-vpc-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/qemu-vpc-candidate/evidence/**/*.json
            ${{ runner.temp }}/qemu-vpc-candidate/evidence/**/*.jsonl
            ${{ runner.temp }}/qemu-vpc-candidate/evidence/**/*.txt
            ${{ runner.temp }}/qemu-vpc-candidate/evidence/**/*.sha256
            ${{ runner.temp }}/qemu-vpc-candidate/evidence/apt.conf
            ${{ runner.temp }}/qemu-vpc-candidate/evidence/*.acl
            ${{ runner.temp }}/qemu-vpc-candidate/guest/evidence/**
            ${{ runner.temp }}/qemu-vpc-candidate/guest/packaging/state.json
            ${{ runner.temp }}/qemu-vpc-candidate/guest/packaging/packaging.json
            ${{ runner.temp }}/qemu-vpc-candidate/guest/packaging/package-report.json
            ${{ runner.temp }}/qemu-vpc-candidate/guest/packaging/local-*-serial.log
            ${{ runner.temp }}/qemu-vpc-candidate/guest/packaging/boot-*/report.json
            ${{ runner.temp }}/qemu-vpc-candidate/guest/packaging/boot-*/hyperv-efi-boot.log
            ${{ runner.temp }}/qemu-vpc-candidate/guest/export/prepared-image-manifest.json
          if-no-files-found: error
          retention-days: 7
