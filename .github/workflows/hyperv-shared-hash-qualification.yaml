name: Hyper-V shared hash qualification

on:
  push:
    branches: [fleet/wamr-shared-hash-budget]
  workflow_dispatch:

permissions:
  attestations: read
  contents: read

jobs:
  native-shared-hash:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3]
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Checkout unchanged merged persistence baseline
      uses: actions/checkout@v4
      with:
        ref: 3d024e0eead73099230aac278ec106bd0d8561a7
        path: .d/shared-hash-baseline
        persist-credentials: false

    - name: Checkout the immutable Zig 0.16 probe generation
      uses: actions/checkout@v4
      with:
        ref: e98623f780fa23d05b5797004e4b88160404eb1b
        path: .d/shared-hash-probe16
        persist-credentials: false

    - name: Install the immutable baseline's compiler
      uses: cataggar/ghr/actions/install@114926d37d3825e63bede2ccc7ce56b67eda7495
      with:
        ghr-version: v0.8.0
        tools: cataggar/zig@v0.16.0 RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U

    - name: Retain the baseline compiler independently of the candidate
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        test "$(zig version)" = 0.16.0
        destination="${RUNNER_TEMP}/shared-hash-zig-0.16.0"
        test ! -e "${destination}"
        test ! -L "${destination}"
        mkdir -m 700 "${destination}"
        cp -a -- "$(dirname "$(readlink -f "$(command -v zig)")")/." "${destination}/"
        test "$("${destination}/zig" version)" = 0.16.0

    - name: Install the pinned candidate compiler
      uses: cataggar/ghr/actions/install@114926d37d3825e63bede2ccc7ce56b67eda7495
      with:
        ghr-version: v0.8.0
        tools: cataggar/zig@v0.17.0 RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U

    - name: Acquire pinned native ELF qualification tools
      uses: cataggar/ghr/actions/download@114926d37d3825e63bede2ccc7ce56b67eda7495
      with:
        ghr-version: v0.8.0
        tools: cataggar/llvm-project/llvm-tools-22.1.8-x86_64-linux.tar.xz@llvm-zig-22.1.8
        dest: ${{ github.workspace }}/.d/shared-hash-llvm
        extract: 'true'
        strip-components: '1'
        cache: 'false'

    - name: Compare actual worker hashes and run all persistence cases
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        root="${GITHUB_WORKSPACE}/.d/shared-hash-native"
        baseline="${GITHUB_WORKSPACE}/.d/shared-hash-baseline"
        probe16="${GITHUB_WORKSPACE}/.d/shared-hash-probe16"
        zig16="${RUNNER_TEMP}/shared-hash-zig-0.16.0/zig"
        test "$("${zig16}" version)" = 0.16.0
        test "$(zig version)" = 0.17.0
        export ZIG_GLOBAL_CACHE_DIR="${root}/global"
        mkdir -p "${root}/restore" "${root}/baseline-restore" "${ZIG_GLOBAL_CACHE_DIR}/tmp"
        objcopy="${GITHUB_WORKSPACE}/.d/shared-hash-llvm/bin/llvm-objcopy"
        test -x "${objcopy}"
        "${objcopy}" --version > "${root}/objcopy-version.txt"
        awk -f support/tools/hyperv/preparation/ci-objcopy-version.awk \
          "${root}/objcopy-version.txt"
        sha256sum "${objcopy}" > "${root}/objcopy-sha256.txt"
        cp support/tools/hyperv/persistence/build.zig \
          support/tools/hyperv/persistence/build.zig.zon \
          support/tools/hyperv/persistence/fixture_build_schema.zig \
          support/tools/hyperv/persistence/fixture_parent_metadata.zig "${root}/restore/"
        zig build --build-file "${root}/restore/build.zig" --fetch=all -j2
        cp "${probe16}/support/tools/hyperv/persistence/build.zig" \
          "${probe16}/support/tools/hyperv/persistence/build.zig.zon" \
          "${probe16}/support/tools/hyperv/persistence/fixture_build_schema.zig" \
          "${probe16}/support/tools/hyperv/persistence/fixture_parent_metadata.zig" \
          "${root}/baseline-restore/"
        "${zig16}" build --build-file "${root}/baseline-restore/build.zig" --fetch=all -j2
        # Add only probe/build dependencies. Baseline production callers remain
        # the immutable merged source and still use their original standard SHA.
        cp "${probe16}/support/tools/hyperv/persistence/build.zig" \
          "${probe16}/support/tools/hyperv/persistence/build.zig.zon" \
          "${probe16}/support/tools/hyperv/persistence/cost_probe.zig" \
          "${probe16}/support/tools/hyperv/persistence/fixture_build_schema.zig" \
          "${probe16}/support/tools/hyperv/persistence/fixture_parent_metadata.zig" \
          "${baseline}/support/tools/hyperv/persistence/"
        cp "${probe16}/support/tools/hyperv/sha256.zig" \
          "${probe16}/support/tools/hyperv/sha256_clear_upper.S" \
          "${probe16}/support/tools/hyperv/sha256_tests.zig" \
          "${baseline}/support/tools/hyperv/"
        git -C "${baseline}" diff --exit-code HEAD -- \
          support/tools/hyperv/core.zig \
          support/tools/hyperv/private_files.zig \
          support/tools/hyperv/persistence/local.zig \
          support/tools/hyperv/persistence/worker.zig \
          support/tools/hyperv/transfer/files.zig
        for variant in baseline candidate; do
          source="${GITHUB_WORKSPACE}"
          compiler=zig
          optimize=debug
          packages="${root}/restore/zig-pkg"
          if [[ "${variant}" == baseline ]]; then
            source="${baseline}"
            compiler="${zig16}"
            optimize=Debug
            packages="${root}/baseline-restore/zig-pkg"
          fi
          mkdir -p "${root}/${variant}/debug/fixtures"
          echo "persistence synthetic configuration: ${variant} on the same native runner"
          "${compiler}" build --build-file "${source}/support/tools/hyperv/persistence/build.zig" \
            --system "${packages}" \
            --cache-dir "${root}/${variant}/debug/cache" \
            -Dtest-root="${root}/${variant}/debug/fixtures" \
            -Dpersistence-timing=true -Dstrip-fixture-debug=true \
            -Dfixture-file-relayout=true "-Dfixture-objcopy=${objcopy}" \
            "-Doptimize=${optimize}" -j2 diagnose-cost --summary all
        done
        for mode in debug safe; do
          mkdir -p "${root}/candidate/${mode}/fixtures"
          zig build --build-file support/tools/hyperv/persistence/build.zig \
            --system "${root}/restore/zig-pkg" \
            --cache-dir "${root}/candidate/${mode}/cache" \
            --prefix "${root}/candidate/${mode}/out" \
            -Dtest-root="${root}/candidate/${mode}/fixtures" \
            -Dpersistence-timing=true -Dstrip-fixture-debug=true \
            -Dfixture-file-relayout=true "-Dfixture-objcopy=${objcopy}" \
            "-Dstrip-fixture-report=${root}/candidate/${mode}/fixture-strip-proof.json" \
            "-Doptimize=${mode}" -j2 \
            test test-arm test-strip-equivalence test-strip-proof \
            test-build-evidence test-build-evidence-exclusion install --summary all
          if "${root}/candidate/${mode}/out/bin/uk-hyperv-persistence-engine" run \
            > "${root}/candidate/${mode}/parked-refusal.json" 2>&1; then
            echo "unexpected production admission" >&2
            exit 1
          fi
          grep -Fq '"reason":"production_bindings_unavailable"' \
            "${root}/candidate/${mode}/parked-refusal.json"
        done
        zig build test-native-make-environment hyperv-object-proofs \
          test-hyperv-persistence-workflow \
          -Doptimize=debug -j2 \
          --cache-dir "${root}/native-build-cache" \
          --prefix "${root}/native-build-out" --summary all

    - name: Compare original preparation hashes on identical actual namespace fixtures
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        root="${GITHUB_WORKSPACE}/.d/preparation-hash-native"
        baseline="${GITHUB_WORKSPACE}/.d/shared-hash-baseline"
        probe16="${GITHUB_WORKSPACE}/.d/shared-hash-probe16"
        zig16="${RUNNER_TEMP}/shared-hash-zig-0.16.0/zig"
        test "$("${zig16}" version)" = 0.16.0
        test "$(zig version)" = 0.17.0
        tools="${GITHUB_WORKSPACE}/.d/shared-hash-llvm/bin"
        export ZIG_GLOBAL_CACHE_DIR="${GITHUB_WORKSPACE}/.d/shared-hash-native/global"
        mkdir -p "${root}/git-runtime/lib" "${root}/fixtures"
        # Metadata/copies only, matching the existing public Git fixture closure.
        git_executable="$(readlink -f /usr/bin/git)"
        "${tools}/llvm-readelf" --program-headers --wide "${git_executable}" > "${root}/git-elf.txt"
        loader="$(sed -n 's/.*Requesting program interpreter: \(\/[^]]*\)\].*/\1/p' "${root}/git-elf.txt")"
        test -n "${loader}"
        loader="$(readlink -f "${loader}")"
        ldd "${git_executable}" > "${root}/git-ldd.txt"
        awk '
          $1 ~ /^linux-vdso/ { next }
          $2 == "=>" && $3 ~ /^\// { print $3; next }
          $1 ~ /^\// && $2 ~ /^\(0x[[:xdigit:]]+\)$/ { print $1; next }
          NF { exit 1 }
        ' "${root}/git-ldd.txt" > "${root}/git-runtime-paths.txt"
        cp --no-preserve=mode,ownership "${git_executable}" "${root}/git-runtime/git"
        cp --no-preserve=mode,ownership "${loader}" "${root}/git-runtime/loader"
        chmod 500 "${root}/git-runtime/git" "${root}/git-runtime/loader"
        git_fixture=("-Dgit-executable=${root}/git-runtime/git" "-Dgit-loader=${root}/git-runtime/loader")
        while IFS= read -r source; do
          test -f "${source}"
          if [ "$(readlink -f "${source}")" = "${loader}" ]; then continue; fi
          destination="${root}/git-runtime/lib/$(basename "${source}")"
          test ! -e "${destination}"
          cp --no-preserve=mode,ownership "${source}" "${destination}"
          git_fixture+=("-Dgit-library=${destination}")
        done < "${root}/git-runtime-paths.txt"
        test "${#git_fixture[@]}" -gt 2
        for kind in raw selected; do
          qualification=()
          if [[ "${kind}" == selected ]]; then
            qualification=(-Dstrip-fixture-debug=true -Dfixture-file-relayout=true
              "-Dfixture-objcopy=${tools}/llvm-objcopy"
              "-Dstrip-fixture-report=${root}/fixture-strip-proof.json")
          fi
          # Only compile the real fixture and run the existing unprivileged ELF
          # equivalence verifier. Never execute a namespace fixture/helper here.
          zig build --build-file support/tools/hyperv/preparation/namespace/build.zig \
            --cache-dir "${root}/${kind}/cache" --prefix "${root}/${kind}/out" \
            "-Dworkspace=${root}/fixtures" "${git_fixture[@]}" "${qualification[@]}" \
            -Doptimize=debug -j2 install-fixture --summary all
        done
        cp "${probe16}/support/tools/hyperv/preparation/namespace/build.zig" \
          "${baseline}/support/tools/hyperv/preparation/namespace/"
        cp "${probe16}/support/tools/hyperv/preparation/hash_cost_probe.zig" \
          "${baseline}/support/tools/hyperv/preparation/"
        git -C "${baseline}" diff --exit-code HEAD -- \
          support/tools/hyperv/preparation/files.zig \
          support/tools/hyperv/preparation/contracts.zig \
          support/tools/hyperv/preparation/runtime.zig
        for variant in baseline candidate; do
          source="${GITHUB_WORKSPACE}"
          compiler=zig
          optimize=debug
          if [[ "${variant}" == baseline ]]; then
            source="${baseline}"
            compiler="${zig16}"
            optimize=Debug
          fi
          echo "preparation synthetic configuration: ${variant}; identical full actual fixture inputs"
          "${compiler}" build --build-file "${source}/support/tools/hyperv/preparation/namespace/build.zig" \
            --cache-dir "${root}/${variant}-probe-cache" \
            "-Dworkspace=${root}/fixtures" -Dhash-cost-only=true \
            "-Doptimize=${optimize}" -j2 diagnose-hash-cost --summary all -- \
            "${root}/raw/out/bin/preparation-namespace-fixture" \
            "${root}/selected/out/bin/preparation-namespace-fixture"
        done
