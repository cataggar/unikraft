name: governctl

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    name: label
    steps:
      - name: Get Pull Request Number
        run: echo "PR_NUMBER=$(echo ${{ github.event.number }} | sed 's/\//\\\//g')" >> "$GITHUB_ENV"
        shell: bash

      # governctl authenticates as a bot user, which only exists on the
      # upstream repository. Forks have no such account, so skip cleanly
      # rather than failing every pull request.
      - name: Check governctl configuration
        id: config
        run: |
          if [ -n "${GOVERN_GITHUB_USER}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=governctl::GH_CHECKPATCH_ACTOR is not configured for ${GITHUB_REPOSITORY}; skipping label sync."
          fi
        shell: bash
        env:
          GOVERN_GITHUB_USER: ${{ secrets.GH_CHECKPATCH_ACTOR }}

      - name: Install governctl
        if: steps.config.outputs.configured == 'true'
        run: |
          set -xe
          wget -q "https://github.com/unikraft/governance/releases/download/v${GOVERN_VERSION}/governance_${GOVERN_VERSION}_linux_amd64.deb"
          sudo dpkg -i "governance_${GOVERN_VERSION}_linux_amd64.deb"
        env:
          GOVERN_VERSION: 0.1.9

      - name: Label PR
        if: steps.config.outputs.configured == 'true'
        run: governctl pr sync labels "${GITHUB_REPOSITORY}/${PR_NUMBER}" --labels-dir .github/labels
        env:
          GOVERN_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOVERN_GITHUB_USER: ${{ secrets.GH_CHECKPATCH_ACTOR }}
          GOVERN_NO_RENDER: true
          GOVERN_LOG_LEVEL: warn
