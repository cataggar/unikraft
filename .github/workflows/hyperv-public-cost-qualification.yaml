name: Hyper-V public synthetic cost qualification

on:
  push:
    branches: [fleet/wamr-public-boot-budget]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-public-cost:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3]
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Checkout the immutable pre-fix production baseline with its probe
      uses: actions/checkout@v4
      with:
        ref: f082a44c62386f86aa6bd6238dff8b665db34197
        path: .d/public-cost-baseline
        persist-credentials: false

    - name: Install the pinned native compiler
      uses: cataggar/ghr/actions/install@114926d37d3825e63bede2ccc7ce56b67eda7495
      with:
        ghr-version: v0.8.0
        tools: cataggar/zig@v0.16.0 RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U

    - name: Compare dirty and clean SHA transitions and run every Debug fixture
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        root="${GITHUB_WORKSPACE}/.d/public-cost"
        export ZIG_GLOBAL_CACHE_DIR="${root}/global"
        mkdir -p "${root}/restore" "${ZIG_GLOBAL_CACHE_DIR}/tmp"
        cp support/tools/hyperv/public_image/build.zig \
          support/tools/hyperv/public_image/build.zig.zon "${root}/restore/"
        zig build --build-file "${root}/restore/build.zig" --fetch=all -j2
        mkdir -p "${root}/baseline/fixtures" "${root}/native/fixtures" \
          "${root}/native/import-fixtures"
        echo "public-image synthetic configuration: unchanged merged production baseline"
        zig build \
          --build-file .d/public-cost-baseline/support/tools/hyperv/public_image/build.zig \
          --system "${root}/restore/zig-pkg" \
          --cache-dir "${root}/baseline/cache" \
          -Dtest-root="${root}/baseline/fixtures" \
          -Doptimize=Debug -j2 diagnose-cost --summary all
        echo "public-image synthetic configuration: candidate on the same runner"
        zig build --build-file support/tools/hyperv/public_image/build.zig \
          --system "${root}/restore/zig-pkg" \
          --cache-dir "${root}/native/cache" \
          -Dtest-root="${root}/native/fixtures" \
          -Doptimize=Debug -j2 diagnose-cost --summary all
        zig build --build-file support/tools/hyperv/public_image/build.zig \
          --system "${root}/restore/zig-pkg" \
          --cache-dir "${root}/native/cache" \
          --prefix "${root}/native/out" \
          -Dtest-root="${root}/native/fixtures" \
          -Dimport-test-root="${root}/native/import-fixtures" \
          -Doptimize=Debug -j2 test test-import install --summary all
