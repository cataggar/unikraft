name: Hyper-V fixture debug qualification

on:
  push:
    branches: [fleet/zig-hyperv-fixture-strip-qualification]
  workflow_dispatch:

jobs:
  fixture-debug-qualification:
    name: fixture-debug-qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      attestations: read
      contents: read
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        persist-credentials: false

    - name: Install the pinned native compiler
      uses: cataggar/ghr/actions/install@114926d37d3825e63bede2ccc7ce56b67eda7495
      with:
        ghr-version: v0.8.0
        tools: cataggar/zig@v0.16.0 RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U

    - name: Acquire the pinned native LLVM tools
      uses: cataggar/ghr/actions/download@114926d37d3825e63bede2ccc7ce56b67eda7495
      with:
        ghr-version: v0.8.0
        tools: cataggar/llvm-project/llvm-tools-22.1.8-x86_64-linux.tar.xz@llvm-zig-22.1.8
        dest: ${{ runner.temp }}/hyperv-preparation-llvm
        extract: 'true'
        strip-components: '1'
        cache: 'false'

    - name: Select the native ELF inspection and qualification tools
      run: |
        set -euo pipefail
        tools="${RUNNER_TEMP}/hyperv-preparation-llvm/bin"
        test -x "${tools}/llvm-readelf"
        test -x "${tools}/llvm-objcopy"
        echo "${tools}" >> "${GITHUB_PATH}"

    - name: Qualify verified synthetic debug-data removal
      run: |
        bash support/tools/hyperv/preparation/ci-fixtures.sh \
          --qualify-fixture-debug-stripping

    - name: Retain bounded qualification evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: hyperv-fixture-strip-qualification-evidence
        path: |
          ${{ runner.temp }}/hyperv-ci/native-preparation/baseline.log
          ${{ runner.temp }}/hyperv-ci/native-preparation/Debug/baseline.json
          ${{ runner.temp }}/hyperv-ci/native-preparation/namespace-denial.log
          ${{ runner.temp }}/hyperv-ci/native-preparation/namespace-capability-diagnostics.log
          ${{ runner.temp }}/hyperv-ci/native-preparation/credentials.json
          ${{ runner.temp }}/hyperv-ci/native-preparation/cleanup.json
          ${{ runner.temp }}/hyperv-ci/native-preparation/fixture-sha256.txt
          ${{ runner.temp }}/hyperv-ci/native-preparation/fixture-copies.tsv
          ${{ runner.temp }}/hyperv-ci/native-preparation/fixture-objcopy-version.txt
          ${{ runner.temp }}/hyperv-ci/native-preparation/fixture-objcopy-sha256.txt
          ${{ runner.temp }}/hyperv-ci/native-preparation/Debug/fixture-strip-proof.json
          ${{ runner.temp }}/hyperv-ci/native-preparation/Debug/fixture-build.log
          ${{ runner.temp }}/hyperv-ci/native-preparation/Debug/namespace-baseline.json
          ${{ runner.temp }}/hyperv-ci/native-preparation/Debug/preparation.log
          ${{ runner.temp }}/hyperv-ci/native-preparation/Debug/namespace.log
          ${{ runner.temp }}/hyperv-ci/native-preparation/Debug/integration.log
          ${{ runner.temp }}/hyperv-ci/native-preparation/ReleaseSafe/fixture-strip-proof.json
          ${{ runner.temp }}/hyperv-ci/native-preparation/ReleaseSafe/fixture-build.log
          ${{ runner.temp }}/hyperv-ci/native-preparation/ReleaseSafe/namespace-baseline.json
          ${{ runner.temp }}/hyperv-ci/native-preparation/ReleaseSafe/preparation.log
          ${{ runner.temp }}/hyperv-ci/native-preparation/ReleaseSafe/namespace.log
          ${{ runner.temp }}/hyperv-ci/native-preparation/ReleaseSafe/integration.log
        retention-days: 7
        if-no-files-found: error
